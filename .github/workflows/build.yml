      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KeyboardStudio.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest KeyboardStudio.apk --title "Keyboard Studio" --notes "Debug build ${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardStudio-apk
          path: KeyboardStudio.apk
